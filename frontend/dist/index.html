/* start screen until the app has drawn itself (React replaces everything inside #root) */
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0F2554;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
.boot-in{width:min(420px,86vw);text-align:center}

.boot-sub{margin-top:2px;font-size:15px;font-weight:600;color:#BAE6FD}
.boot-belt{position:relative;height:56px;margin:26px 0 14px;overflow:hidden}
.boot-belt:before{content:"";position:absolute;left:0;right:54px;bottom:10px;height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,#64748B 0 12px,#94A3B8 12px 24px);background-size:24px 7px;animation:bBelt .6s linear infinite}
.boot-box{position:absolute;bottom:17px;width:26px;height:21px;border-radius:3px;background:#D6A86B;opacity:0;animation:bRide 2.4s linear infinite}
.boot-box.b2{animation-delay:.8s}.boot-box.b3{animation-delay:1.6s}
.boot-truck{position:absolute;right:0;bottom:7px;width:50px;height:36px;border-radius:5px 10px 5px 5px;background:#E2E8F0}
.boot-truck:after{content:"";position:absolute;left:7px;bottom:-6px;width:11px;height:11px;border-radius:50%;background:#0B1730;box-shadow:26px 0 0 #0B1730}
.boot-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}

.boot-steps li.s1{animation:bOn 0s .6s forwards}.boot-steps li.s1 i{animation:bTick 0s .6s forwards}
.boot-steps li.s2{animation:bOn 0s 1.5s forwards}.boot-steps li.s2 i{animation:bTick 0s 1.5s forwards}
.boot-steps li.s3 i{border-color:#38BDF8;border-top-color:transparent;animation:bSpin .8s linear infinite}
.boot-steps li.s3{color:#E0F2FE}
@keyframes bOn{to{color:#86EFAC}}@keyframes bTick{to{background:#2E9E5B;border-color:#2E9E5B;color:#fff}}@keyframes bSpin{to{transform:rotate(360deg)}}
@keyframes bBelt{to{background-position:-24px 0}}
@keyframes bRide{0%{left:-28px;opacity:0}8%{opacity:1}88%{opacity:1}100%{left:calc(100% - 62px);opacity:0}}
@keyframes bBar{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}

</style>
