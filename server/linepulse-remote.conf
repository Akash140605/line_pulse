# 25-11-2026 Line Pulse remote access door. Only this PC can reach it (127.0.0.1): the Cloudflare tunnel of this PC
# brings the developer's browser here. It opens ONLY the Line Pulse app and its API: phpMyAdmin, tests, admin scripts,
# server-status and every other site of this XAMPP are refused. PHP sees LP_REMOTE=1: read only, the visitor's own address.
Listen 127.0.0.1:8090
<VirtualHost 127.0.0.1:8090>
    ServerName linepulse-remote
    DocumentRoot "C:/xampp/htdocs"
    SetEnv LP_REMOTE 1
    RewriteEngine On
    RewriteRule ^/?$ /ems-dashboard/frontend/dist/ [R=302,L]
    RewriteCond %{REQUEST_URI} !^/ems-dashboard/frontend/dist/
    RewriteCond %{REQUEST_URI} !^/ems-dashboard/backend/api/[a-z_]+\.php$
    RewriteRule ^ - [F,L]
    <Location "/server-status">
        Require all denied
    </Location>
    <Location "/server-info">
        Require all denied
    </Location>
    ErrorLog "logs/linepulse-remote-error.log"
    CustomLog "logs/linepulse-remote-access.log" combined
</VirtualHost>
